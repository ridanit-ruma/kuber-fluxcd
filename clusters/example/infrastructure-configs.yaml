# Custom resources belonging to the controllers above: the ACME issuers and
# the Ceph cluster, plus the Cloudflare token they need.
# The manifests live in ./infrastructure at the repo root rather than under
# clusters/<your-cluster>, because the flux-system Kustomization scans everything below
# clusters/<your-cluster> recursively. Anything left there is applied with no ordering
# and no sops decryption -- which is how the encrypted Cloudflare token first
# failed, against a cert-manager namespace that did not exist yet.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-controllers
  interval: 30m
  retryInterval: 2m
  timeout: 25m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs
  prune: true
  # cloudflare-api-token.sops.yaml is committed encrypted; kustomize-controller
  # decrypts it in-cluster with the age key held in the sops-age secret, so the
  # plaintext token never reaches git.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
