# Anything that is not the platform itself. cert-manager, the ingress
# controller, Ceph and the tunnel are infrastructure and live in
# ./infrastructure; the things they exist to serve live here.
#
# Separated so a broken service cannot hold up an infrastructure change, and
# so this reconciles after the platform it depends on is actually Ready --
# a workload asking for a ceph-block volume before Rook exists fails on
# nothing more interesting than ordering.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-configs
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps
  prune: true
  # Deliberately not `wait: true`. Infrastructure blocks on being Ready
  # because everything after it depends on it; a service that will not start
  # should not stop its neighbours from reconciling.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
