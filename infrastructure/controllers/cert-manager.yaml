---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The ClusterIssuer in ../configs is a cert-manager CRD, so the CRDs have
    # to come from the chart rather than a separate apply, or the configs
    # Kustomization has nothing to validate against.
    crds:
      enabled: true
      keep: true
    # Single node: one of everything. The chart defaults to one replica each
    # already, but saying so keeps a second node from silently changing it.
    replicaCount: 1
    webhook:
      replicaCount: 1
    cainjector:
      replicaCount: 1
