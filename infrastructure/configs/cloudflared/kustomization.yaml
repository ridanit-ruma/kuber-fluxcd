# Rewritten by cf-tunnel.sh on every add and remove — see the scripts in
# kuber-nixos-flakes. A tunnel is a Deployment plus its token, and both are
# generated: the token is a secret, and the deployment carries the tunnel's id.
#
# Nothing is listed here until you create one:
#
#     scripts/cf-tunnel.sh add <name>
#
# Delete this directory outright if the cluster is reached some other way. The
# ingress controller does not depend on it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
